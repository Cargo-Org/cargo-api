services:
  # =========================================
  # IDENTITY & ACCESS MANAGEMENT (Prod)
  # =========================================
  keycloak:
    container_name: keycloak
    volumes:
      - ../../Infrastructure/Keycloak/cargo-realm.json:/opt/keycloak/data/import/cargo-realm.json:ro
    # Override: add --import-realm flag (IGNORE_EXISTING strategy — safe to run every restart)
    command:
      - "/opt/keycloak/bin/kc.sh start --import-realm --optimized || /opt/keycloak/bin/kc.sh start --import-realm"

  # =========================================
  # APPLICATION SERVICES (Prod)
  # =========================================
  customer-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  # =========================================
  # REVERSE PROXY — Caddy (Prod only)
  # Handles TLS termination via Let's Encrypt.
  # All public traffic flows through Caddy.
  # =========================================
  caddy:
    image: caddy:2.11.2-alpine
    container_name: caddy_proxy
    restart: unless-stopped
    networks:
      - delivery-net
    depends_on:
      keycloak-waiter:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
